version: '3.8'

# 网络隔离: internal 仅后端<->数据库通信，web 为前端可访问
networks:
  internal:
    internal: true
  web:

services:
  mysql:
    image: mysql:8.0
    container_name: ai-resume-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ai_resume_optimizer
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sh:/docker-entrypoint-initdb.d/01-create-app-user.sh:ro
    ports:
      - "127.0.0.1:3306:3306"  # 仅本地访问，不对外暴露
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-resume-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://ai_resume_app:${DB_APP_PASSWORD}@mysql:3306/ai_resume_optimizer?schema=public&connection_limit=10
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      AI_API_KEY: ${AI_API_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174}
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    ports:
      - "127.0.0.1:3000:3000"  # 仅本地访问
    networks:
      - internal
      - web
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend-user:
    build:
      context: ./frontend-user
      dockerfile: Dockerfile
    container_name: ai-resume-frontend-user
    restart: always
    networks:
      - web
    depends_on:
      - backend
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  frontend-admin:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
    container_name: ai-resume-frontend-admin
    restart: always
    networks:
      - web
    depends_on:
      - backend
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  gateway:
    image: nginx:alpine
    container_name: ai-resume-gateway
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - web
    depends_on:
      - frontend-user
      - frontend-admin
      - backend
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  mysql_data:
  uploads:
  logs:
